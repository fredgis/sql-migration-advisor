name: Weekly KB freshness check

# Every Monday, for each of the three knowledge bases this repository maintains: verify internal
# consistency, prove every cited source and heading anchor still resolves, gather official news and
# route it, re-hash the volatile source sections behind the load-bearing claims, ask a model to
# review each document against that evidence, and then either open a maintenance pull request or
# open an issue asking a human to decide.
#
# The governing rule is that no automated signal edits guidance. A model verdict, a drifted hash and
# a dead link are all reasons to ask a human; none of them is a reason to change a sentence. A
# version moves only when a real content diff already exists, judged by the same code that applies
# the bump.

on:
  pull_request:
    branches: [main]
    # Every file the checks below read or write. A path missing here is a change that reaches main
    # without the gate that exists to catch it.
    paths:
      - 'docs/sql-server-to-azure-migration.md'
      - 'docs/sql-server-to-azure-migration-prerequisite.md'
      - 'docs/sql-server-to-azure-migration-connectivity.md'
      - 'reference/decision-rules.md'
      - 'reference/claims-registry.json'
      - 'skills/recommend-migration-path/SKILL.md'
      - 'skills/generate-migration-prerequisite-plan/**'
      - 'skills/get-connection-details/**'
      - 'tests/check-prerequisite-skill.mjs'
      - 'tools/weekly-check/**'
      - 'version.json'
      - 'README.md'
      - '.github/workflows/weekly-kb-check.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'News look-back window (days)'
        default: '7'
      force_pr:
        description: 'Open a PR even if only housekeeping was applied (for testing)'
        type: boolean
        default: false

# Read-only by default. The three jobs that need more are granted it individually, so the job that
# runs JavaScript from a pull request branch cannot reach a token that can write to the repository
# or mint an Azure identity.
permissions:
  contents: read

# Scheduled and manual runs share one group because they write the same fixed branch. Splitting them
# by event name let a manual run and the Monday run push to weekly-kb-update at the same time. Pull
# requests are serialised per ref instead, so one contributor never queues behind another.
concurrency:
  group: >-
    weekly-kb-check-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'write' }}
  cancel-in-progress: false

jobs:
  consistency:
    name: Consistency gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Check consistency across all three knowledge bases
        run: node tools/weekly-check/check-consistency.mjs

      - name: Check prerequisite KB / skill contracts
        run: node tests/check-prerequisite-skill.mjs

  # Live source verification. Network-bound, so it never runs on a pull request, where a moved
  # Microsoft heading would block an unrelated contributor. Failures do not abort the job: they are
  # recorded as evidence and reach the decision stage, which is what turns them into an issue
  # somebody actually reads. A job that merely went red would notify nobody.
  sources:
    name: Sources and anchors
    if: github.event_name != 'pull_request'
    needs: consistency
    runs-on: ubuntu-latest
    outputs:
      doc_links_exit: ${{ steps.doclinks.outputs.exit_code }}
      prereq_links_ok: ${{ steps.prereqlinks.outputs.ok }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Verify every cited source and heading anchor in all three knowledge bases
        id: doclinks
        run: |
          set +e
          node tools/weekly-check/check-doc-links.mjs --concurrency 8
          CODE=$?
          set -e
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify every prerequisite catalogue source and anchor still resolves
        id: prereqlinks
        run: |
          set +e
          node tests/check-prerequisite-skill.mjs --check-links
          CODE=$?
          set -e
          if [ "${CODE}" -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Upload source verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-sources
          path: |
            doc-links.md
            doc-links.json
          if-no-files-found: warn
          retention-days: 14

  # Evidence gathering. Independent of the model, and the part most likely to fail for boring
  # reasons: a dead link, a feed timing out, a source page moving.
  evidence:
    name: Evidence
    if: github.event_name != 'pull_request'
    needs: consistency
    runs-on: ubuntu-latest
    outputs:
      news_count: ${{ steps.news.outputs.count }}
      lychee_exit: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Check links (lychee)
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 2
            --accept 200,206,301,302,307,308
            --exclude 'partner\.microsoft\.com'
            docs/sql-server-to-azure-migration.md
            docs/sql-server-to-azure-migration-prerequisite.md
            docs/sql-server-to-azure-migration-connectivity.md
          format: markdown
          output: ./lychee-report.md
          fail: false
          failIfEmpty: false
          jobSummary: false

      - name: Classify link results
        env:
          LYCHEE_EXIT: ${{ steps.lychee.outputs.exit_code }}
        run: node tools/weekly-check/classify-links.mjs

      - name: Gather and route news
        id: news
        run: |
          COUNT=$(node tools/weekly-check/gather-news.mjs --days "${{ github.event.inputs.days || '7' }}" --out news)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Verify claims/source hashes
        continue-on-error: true
        run: node tools/weekly-check/verify-claims.mjs

      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-evidence
          path: |
            lychee-report.md
            link-summary.md
            link-summary.json
            news.md
            news.json
            news-routing.json
            claims-report.md
            claims-report.json
          if-no-files-found: warn
          retention-days: 14

  # The model review: one pass per knowledge base, in sequence.
  #
  # Advisory by design, so every failure path is tolerated and the run continues. What it must never
  # do is fail silently: a missing response is recorded as "the review did not run", which the
  # decision stage treats as a reason to ask a human, not as a clean verdict.
  review:
    name: Model review
    if: github.event_name != 'pull_request'
    needs: [evidence, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC federation to Azure; no stored client secret
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Download evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-evidence

      - name: Download source verification
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-sources

      - name: Sign in to Azure (GitHub OIDC, no stored secret)
        id: azlogin
        continue-on-error: true
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AI review — one pass per knowledge base
        if: steps.azlogin.outcome == 'success'
        continue-on-error: true
        env:
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
          AZURE_AI_DEPLOYMENT: ${{ secrets.AZURE_AI_DEPLOYMENT }}
        run: |
          for KB in migration prerequisite connectivity; do
            echo "::group::AI review — ${KB}"
            node tools/weekly-check/build-prompt.mjs --kb "${KB}" > "prompt-${KB}.txt"
            wc -c "prompt-${KB}.txt"
            # A fresh token per pass: three deep reviews can outlast one token, and an expiry
            # halfway through would silently cost the last knowledge base its review.
            TOKEN="$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)"
            echo "::add-mask::$TOKEN"
            AZURE_AI_TOKEN="$TOKEN" \
            AI_PROMPT_FILE="prompt-${KB}.txt" \
            AI_RESPONSE_FILE="response-${KB}.txt" \
              node tools/weekly-check/ai-review.mjs || echo "review for ${KB} did not complete"
            echo "::endgroup::"
          done

      - name: Record which reviews produced no response
        if: always()
        run: |
          for KB in migration prerequisite connectivity; do
            if [ ! -s "response-${KB}.txt" ]; then
              echo "no verdict for ${KB}: the decision stage will report it as unreviewed"
              : > "response-${KB}.txt"
            fi
          done

      - name: Upload review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-review
          path: response-*.txt
          if-no-files-found: warn
          retention-days: 14

  # Decision and delivery. These steps share the working tree deliberately: applying stamps,
  # rebuilding artifacts and opening the pull request all operate on the same checkout.
  decide:
    name: Decide and deliver
    if: github.event_name != 'pull_request'
    needs: [sources, evidence, review]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Download evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-evidence

      - name: Download source verification
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-sources

      - name: Download review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-review

      - name: Decide
        id: decide
        env:
          NEWS_COUNT: ${{ needs.evidence.outputs.news_count }}
          PREREQ_LINKS_OK: ${{ needs.sources.outputs.prereq_links_ok }}
        run: node tools/weekly-check/decide.mjs

      - name: Apply metadata updates
        id: apply
        if: steps.decide.outputs.apply_mode != 'none' || github.event.inputs.force_pr == 'true'
        run: |
          if [ "${{ steps.decide.outputs.apply_mode }}" = "substantive" ]; then
            node tools/weekly-check/apply-update.mjs \
              --substantive \
              --bump "${{ steps.decide.outputs.bump }}" \
              --changelog "$(cat changelog.txt)"
          else
            node tools/weekly-check/apply-update.mjs --housekeeping
          fi

      - name: Re-check consistency after applying metadata
        if: steps.decide.outputs.apply_mode != 'none' || github.event.inputs.force_pr == 'true'
        run: node tools/weekly-check/check-consistency.mjs

      - name: Install PDF toolchain
        if: steps.decide.outputs.pr_required == 'true' || github.event.inputs.force_pr == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended \
            texlive-latex-extra lmodern fonts-dejavu poppler-utils

      - name: Setup Chrome
        id: chrome
        if: steps.decide.outputs.pr_required == 'true' || github.event.inputs.force_pr == 'true'
        continue-on-error: true
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
        with:
          install-dependencies: true

      - name: Regenerate PDF + preview
        id: pdf
        if: steps.decide.outputs.pr_required == 'true' || github.event.inputs.force_pr == 'true'
        continue-on-error: true
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm install --prefix tools/pdf --no-audit --no-fund
          node tools/pdf/build.mjs
          node tools/pdf/patchwork.mjs

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 🔄 Weekly KB check"
            echo "- News items: \`${{ needs.evidence.outputs.news_count }}\`"
            echo "- Link check exit code: \`${{ needs.evidence.outputs.lychee_exit }}\`"
            echo "- Source/anchor check exit code: \`${{ needs.sources.outputs.doc_links_exit }}\`"
            echo "- Prerequisite catalogue sources healthy: \`${{ needs.sources.outputs.prereq_links_ok }}\`"
            echo "- Reviews with no verdict: \`${{ steps.decide.outputs.review_unavailable || 'none' }}\`"
            echo "- Apply mode: \`${{ steps.decide.outputs.apply_mode }}\`"
            echo "- Knowledge bases with substantive edits: \`${{ steps.decide.outputs.substantive_kbs || 'none' }}\`"
            echo "- PR required: \`${{ steps.decide.outputs.pr_required }}\` · issue required: \`${{ steps.decide.outputs.issue_required }}\`"
            echo "- PDF regeneration: \`${{ steps.pdf.outcome || 'skipped' }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cat doc-links.md >> "$GITHUB_STEP_SUMMARY" || true
          cat link-summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cat claims-report.md >> "$GITHUB_STEP_SUMMARY" || true
          cat news.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Create Pull Request
        if: steps.decide.outputs.pr_required == 'true' || github.event.inputs.force_pr == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: weekly-kb-update
          delete-branch: true
          title: 'Weekly KB freshness update'
          body-path: pr-body.md
          commit-message: |
            Weekly KB freshness update

            Automated by .github/workflows/weekly-kb-check.yml
            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          labels: |
            automated
            knowledge-base
          # Exactly the files the apply step reports having written, plus the two generated artifacts
          # rebuilt above. Hand-listing these drifted once already: the list named five paths while
          # the apply step wrote fourteen, so a bump would have shipped without the skill and the
          # manifest that advertise it.
          add-paths: |
            ${{ steps.apply.outputs.files_multiline }}
            docs/sql-server-to-azure-migration.pdf
            docs/preview/sql-migration-advisor-pdf-preview.png

      - name: Open or update the report-only issue
        if: steps.decide.outputs.issue_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: 'Weekly KB report: human review required'
        run: |
          # A persistent broken link produced a fresh issue every Monday, so the backlog filled with
          # copies of one problem and each copy looked new. One open report is updated in place until
          # a human closes it.
          EXISTING="$(gh issue list --state open --label automated --label knowledge-base \
            --json number,title --limit 100 \
            --jq "map(select(.title == \"${ISSUE_TITLE}\")) | .[0].number // empty")"
          if [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body-file issue-body.md
            echo "updated existing report #${EXISTING}"
          else
            gh issue create --title "${ISSUE_TITLE}" --body-file issue-body.md \
              --label automated --label knowledge-base
          fi
