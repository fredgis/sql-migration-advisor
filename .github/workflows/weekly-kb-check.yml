name: Weekly KB freshness check

# Every Monday: verify KB consistency, check links, scan watched official sources,
# verify high-risk claim source hashes, and open a human-review PR/issue. A version
# bump is allowed only after substantive content edits exist and consistency passes.

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/sql-server-to-azure-migration.md'
      - 'docs/sql-server-to-azure-migration-prerequisite.md'
      - 'skills/generate-migration-prerequisite-plan/**'
      - 'tests/check-prerequisite-skill.mjs'
      - 'reference/decision-rules.md'
      - 'reference/claims-registry.json'
      - 'README.md'
      - 'tools/weekly-check/**'
      - '.github/workflows/weekly-kb-check.yml'
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      days:
        description: 'News look-back window (days)'
        default: '7'
      force_pr:
        description: 'Open a PR even if only housekeeping was applied (for testing)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: weekly-kb-check-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Check KB / decision-rules consistency
        run: node tools/weekly-check/check-consistency.mjs

      # The prerequisite KB has its own gate. Running it here means a weekly run fails on a broken
      # prerequisite contract instead of only on a broken Advisor KB.
      - name: Check prerequisite KB / skill contracts
        run: node tests/check-prerequisite-skill.mjs

  # Live source and anchor verification. Network-bound, so it never runs on a pull request,
  # where a moved Microsoft heading would block an unrelated contributor. It stands as its own
  # job rather than a step inside evidence: a rotted anchor turns this red on its own instead
  # of aborting the run before the evidence artifacts are uploaded.
  sources:
    if: github.event_name != 'pull_request'
    needs: consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Verify every prerequisite source and anchor still resolves
        run: node tests/check-prerequisite-skill.mjs --check-links

  # Evidence gathering. Independent of the model, and the part most likely to fail for
  # boring reasons: a dead link, a feed timing out, a source page moving. Isolated so a
  # failure here names itself instead of hiding inside a twenty-step job.
  evidence:
    if: github.event_name != 'pull_request'
    needs: consistency
    runs-on: ubuntu-latest
    outputs:
      news_count: ${{ steps.news.outputs.count }}
      lychee_exit: ${{ steps.lychee.outputs.exit_code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Check links (lychee)
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress --max-concurrency 8 --timeout 30 --max-retries 2
            --accept 200,206,301,302,307,308
            --exclude 'partner\.microsoft\.com'
            docs/sql-server-to-azure-migration.md
            docs/sql-server-to-azure-migration-prerequisite.md
          format: markdown
          output: ./lychee-report.md
          fail: false
          failIfEmpty: false
          jobSummary: false

      - name: Classify link results
        env:
          LYCHEE_EXIT: ${{ steps.lychee.outputs.exit_code }}
        run: node tools/weekly-check/classify-links.mjs

      - name: Gather news
        id: news
        run: |
          COUNT=$(node tools/weekly-check/gather-news.mjs --days "${{ github.event.inputs.days || '7' }}" --out news)
          echo "count=${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Verify claims/source hashes
        continue-on-error: true
        run: node tools/weekly-check/verify-claims.mjs

      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-evidence
          path: |
            lychee-report.md
            link-summary.md
            link-summary.json
            news.md
            news.json
            claims-report.md
            claims-report.json
          if-no-files-found: warn
          retention-days: 14

  # The model review. Advisory by design, so every failure path here is tolerated and the
  # run continues with an empty verdict rather than losing the deterministic evidence.
  review:
    if: github.event_name != 'pull_request'
    needs: evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Download evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-evidence

      - name: Build review prompt
        run: node tools/weekly-check/build-prompt.mjs > prompt.txt

      - name: Sign in to Azure (GitHub OIDC, no stored secret)
        id: azlogin
        continue-on-error: true
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AI review (Azure AI Foundry)
        if: steps.azlogin.outcome == 'success'
        continue-on-error: true
        env:
          AZURE_AI_ENDPOINT: ${{ secrets.AZURE_AI_ENDPOINT }}
          AZURE_AI_DEPLOYMENT: ${{ secrets.AZURE_AI_DEPLOYMENT }}
        run: |
          TOKEN="$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          AZURE_AI_TOKEN="$TOKEN" node tools/weekly-check/ai-review.mjs

      - name: Ensure an AI response file exists
        if: always()
        run: test -f response.txt || touch response.txt

      - name: Upload review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-review
          path: response.txt
          if-no-files-found: warn
          retention-days: 14

  # Decision and delivery. These steps share the working tree deliberately: applying stamps,
  # rebuilding artifacts and opening the pull request all operate on the same checkout.
  decide:
    if: github.event_name != 'pull_request'
    needs: [evidence, review]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Download evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-evidence

      - name: Download review
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: weekly-review

      - name: Decide
        id: decide
        env:
          NEWS_COUNT: ${{ needs.evidence.outputs.news_count }}
        run: node tools/weekly-check/decide.mjs

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 🔄 Weekly KB check"
            echo "- Link check exit code: \`${{ needs.evidence.outputs.lychee_exit }}\`"
            echo "- News items: \`${{ needs.evidence.outputs.news_count }}\`"
            echo "- PR required: \`${{ steps.decide.outputs.pr_required }}\`"
            echo "- Issue required: \`${{ steps.decide.outputs.issue_required }}\`"
            echo "- Apply mode: \`${{ steps.decide.outputs.apply_mode }}\`"
            echo "- Version bump: \`${{ steps.decide.outputs.changed }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          cat link-summary.md >> "$GITHUB_STEP_SUMMARY" || true
          cat claims-report.md >> "$GITHUB_STEP_SUMMARY" || true
          cat news.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Apply housekeeping stamps only
        if: steps.decide.outputs.apply_mode == 'housekeeping' || github.event.inputs.force_pr == 'true'
        run: node tools/weekly-check/apply-update.mjs --housekeeping

      - name: Apply version bump + changelog for pre-existing substantive edits
        if: steps.decide.outputs.apply_mode == 'substantive'
        run: node tools/weekly-check/apply-update.mjs --substantive --bump "${{ steps.decide.outputs.bump }}" --changelog "$(cat changelog.txt)"

      - name: Re-check consistency after applying metadata
        if: steps.decide.outputs.apply_mode != 'none' || github.event.inputs.force_pr == 'true'
        run: node tools/weekly-check/check-consistency.mjs

      - name: Install PDF toolchain
        if: steps.decide.outputs.pr_required == 'true' || github.event.inputs.force_pr == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-recommended \
            texlive-latex-extra lmodern fonts-dejavu poppler-utils

      - name: Setup Chrome
        id: chrome
        if: steps.decide.outputs.pr_required == 'true' || github.event.inputs.force_pr == 'true'
        continue-on-error: true
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2
        with:
          install-dependencies: true

      - name: Regenerate PDF + preview
        if: steps.decide.outputs.pr_required == 'true' || github.event.inputs.force_pr == 'true'
        continue-on-error: true
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm install --prefix tools/pdf --no-audit --no-fund
          node tools/pdf/build.mjs
          node tools/pdf/patchwork.mjs

      - name: Create Pull Request
        if: steps.decide.outputs.pr_required == 'true' || github.event.inputs.force_pr == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: weekly-kb-update
          delete-branch: true
          title: 'Weekly KB freshness update'
          body-path: pr-body.md
          commit-message: |
            Weekly KB freshness update

            Automated by .github/workflows/weekly-kb-check.yml
            Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>
          labels: |
            automated
            knowledge-base
          add-paths: |
            docs/sql-server-to-azure-migration.md
            docs/sql-server-to-azure-migration.pdf
            docs/preview/sql-migration-advisor-pdf-preview.png
            reference/decision-rules.md
            README.md

      - name: Open report-only issue
        if: steps.decide.outputs.issue_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Weekly KB report: human review required" --body-file issue-body.md --label automated --label knowledge-base
