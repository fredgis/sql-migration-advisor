name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Check canonical rules data
        run: node tools/rules/check-rules-data.mjs --strict
      - name: Run deterministic regression tests
        run: node tests/run-tests.mjs
