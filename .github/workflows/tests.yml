name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Lint workflow files
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
      - name: Check canonical rules data
        run: node tools/rules/check-rules-data.mjs --strict
      - name: Run deterministic regression tests
        run: node tests/run-tests.mjs
      - name: Check prerequisite skill integrity
        # Structural gate for generate-migration-prerequisite-plan: path, question and prerequisite
        # coverage, schema parity and source metadata. Link resolution is deliberately excluded
        # here so a Microsoft Learn outage cannot fail an unrelated pull request; the weekly
        # freshness job owns that.
        run: node tests/check-prerequisite-skill.mjs
      - name: Engine branch coverage
        # Scoped to the decision engine. The scenarios can all pass while a branch of the
        # engine is never exercised, which is how a gate can exist and protect nothing.
        run: >-
          node --experimental-test-coverage
          --test-coverage-include='tests/engine/**'
          --test-coverage-branches=85
          --test tests/run-tests.mjs
